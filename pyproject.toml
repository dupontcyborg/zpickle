[build-system]
requires = [
    "setuptools>=61.0.0",
    "wheel",
    "setuptools_scm>=6.2"
]
build-backend = "setuptools.build_meta"

[project]
name = "zpickle"
description = "Transparent, drop-in compression for Python's pickle — smaller files, same API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Nicolas Dupont"}
]
keywords = ["pickle", "compression", "serialization", "zstd", "brotli", "zlib", "lzma", "bzip2", "lz4", "snappy", "gzip", "deflate"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Archiving :: Compression",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]
dependencies = [
    "compress-utils>=0.10.1",
]
dynamic = ["version"]

[project.urls]
"Homepage" = "https://github.com/dupontcyborg/zpickle"
"Bug Tracker" = "https://github.com/dupontcyborg/zpickle/issues"
"Documentation" = "https://github.com/dupontcyborg/zpickle#readme"
"Source Code" = "https://github.com/dupontcyborg/zpickle"

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
write_to = "zpickle/_version.py"
fallback_version = "0.0.0+unknown"

[tool.setuptools]
packages = ["zpickle"]
zip-safe = false

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"